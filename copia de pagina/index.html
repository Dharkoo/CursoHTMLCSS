<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FromSoftware - Accordion Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="hero">
      
      <!-- Contenedor del Acordeón con Skew -->
      <div class="accordion-container">
        
        <section class="panel panel-1"
                >
          <div class="panel-bg"></div>
          <div class="panel-content">
            <img src="duskbloods.png" alt="">
          </div>
        </section>

        <section class="panel panel-2"
                 >
          <div class="panel-bg"></div>
          <div class="panel-content">
            <img src="eldenring.png" alt="">
          </div>
        </section>

        <section class="panel panel-3"
                >
          <div class="panel-bg"></div>
          <div class="panel-content">
            <img src="ac6.png" alt="">
          </div>
        </section>

        <section class="panel panel-4"
                 >
          <div class="panel-bg"></div>
          <div class="panel-content">
            <img src="nightreign.png" alt="">
          </div>
        </section>

        <section class="panel panel-5">
          <a href="sekiro.html"><div class="panel-bg"></div>
          <div class="panel-content">
            <img src="sekiro.png" alt=""> 
          </div>
          </a>
        </section>

      </div>

      

      <!-- Elementos Superpuestos (UI) -->
      <header class="header">
        <div class="logo">
          <img src="corp.svg" alt="" >
        </div>

        <nav class="menu">
          <a href="#">COMPANY</a>
          <a href="#">PRODUCTS</a>
          <a href="#">PRESS RELEASE</a>
          <a href="#">RECRUIT</a>
          <a href="#">SUPPORT</a>
        </nav>
      </header>

      <div class="news">
        <div class="news-top">
          <span>2026.06.04</span>
          <strong>PRESS RELEASE</strong>
        </div>
        <p>
          Nintendo Switch 2 "ELDEN RING Tarnished Edition" Releasing on August
          28th (Fri) 2026
        </p>
      </div>
      <div class="social">
        <img src="sns_f-2.png" alt="facebook">
        <img src="sns_i-2.png" alt="instagram">
        <img src="sns_x.png" alt="twitter">
        <img src="sns_y-2.png" alt="youtube">
      </div>
      <div class="bottom-links">
        <p>» ARMORED CORE OFFICIAL SITE</p>
        <p>» DARK SOULS OFFICIAL SITE</p>

        <div class="footer-menu">
          <span>SNS</span>
          <span>ACCESS</span>
          <span>PRIVACY POLICY</span>
          <span>SITE POLICY</span>
          <span>SITEMAP</span>
          <span>English</span>
        </div>
      </div>

      
    </main>
    
  </body>
</html>
